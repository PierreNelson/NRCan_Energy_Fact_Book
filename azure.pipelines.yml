trigger: none # Change to a specific branch if you want CI triggers, or use webhooks

schedules:
- cron: "0 *]5 * * *" # Example: Runs every hour
  displayName: Daily GitHub Sync at 5 AM
  branches:
    include:
    - main
  always: true

jobs:
- job: SyncGitHubToADO
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: none # Disables default checkout to ensure a clean working directory

  - script: |
      # 1. Clone the GitHub repository as a mirror (fetches all branches, tags, and history)
      # If the GitHub repo is public, you can remove the PAT authentication.
      echo "Cloning from GitHub..."
      git clone --mirror https://$(GitHubPAT)@github.com/YourGitHubOrg/YourGitHubRepo.git repo-mirror.git
      
      cd repo-mirror.git
      
      # 2. Add the Azure DevOps repository as a remote
      # System.AccessToken acts as the authentication token to push to ADO.
      echo "Setting ADO remote..."
      git remote add ado https://Token:$(System.AccessToken)@dev.azure.com/YourADOOrg/YourADOProject/_git/YourADORepo
      
      # 3. Push the mirrored repository to Azure DevOps
      echo "Pushing mirror to Azure DevOps..."
      git push --mirror ado
      
    env:
      # Maps the secret variable to an environment variable for the script
      GitHubPAT: $(GitHub_PAT_Secret)
    displayName: 'Mirror Git History from GitHub to ADO'
