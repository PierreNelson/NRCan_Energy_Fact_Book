    <title>Energy Fact Book | Livre de faits sur l'énergie</title>
    <script>
      // GitHub Pages / static host SPA fallback for BrowserRouter deep links
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect-path');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect-path');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
