# Azure DevOps pipeline template — NRCan Energy Factbook
#
# Copy to azure-pipelines.yml and customize:
#   - trigger branches and path filters
#   - agent pool (Windows vs Linux for ODBC)
#   - variable group linking (DB_*, EXTERNAL_XLSX_DATA_DIR)
#   - approval environment before production deploy
#
# See docs/EFB_MODERNIZATION_REVIEW.md and docs/DEPLOYMENT.md

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main

variables:
  - group: NRCanFactbookSecrets
  - name: nodeVersion
    value: '20.x'
  - name: pythonVersion
    value: '3.11'

stages:
  - stage: BuildWebsite
    displayName: Build static website
    jobs:
      - job: npm_build
        displayName: npm ci and build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: npm ci
            displayName: Install npm dependencies
          - script: npm run build
            displayName: Production build
          - script: npm run lint
            displayName: ESLint (informational — see docs/EFB_MODERNIZATION_REVIEW.md §4)
            continueOnError: true
          - publish: dist
            artifact: website-dist
            displayName: Publish dist artifact

  - stage: RefreshData
    displayName: Refresh pipeline data (optional)
    dependsOn: []
    condition: eq(variables['RunDataRefresh'], 'true')
    jobs:
      - job: python_refresh
        displayName: SQL refresh and CSV export
        pool:
          vmImage: windows-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: python -m pip install -r scripts/requirements.txt
            displayName: Install Python dependencies
          - script: python main.py test-connection
            workingDirectory: scripts
            displayName: Test SQL connection
            env:
              DB_SERVER: $(DB_SERVER)
              DB_DATABASE: $(DB_DATABASE)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              EXTERNAL_XLSX_DATA_DIR: $(EXTERNAL_XLSX_DATA_DIR)
          - script: python main.py eedas update --all
            workingDirectory: scripts
            displayName: EEDAS update — load raw source data
            env:
              DB_SERVER: $(DB_SERVER)
              DB_DATABASE: $(DB_DATABASE)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              EXTERNAL_XLSX_DATA_DIR: $(EXTERNAL_XLSX_DATA_DIR)
          - script: python main.py efb transform --all
            workingDirectory: scripts
            displayName: EFB transform — build indicators
            env:
              DB_SERVER: $(DB_SERVER)
              DB_DATABASE: $(DB_DATABASE)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              EXTERNAL_XLSX_DATA_DIR: $(EXTERNAL_XLSX_DATA_DIR)
          - script: python main.py export
            workingDirectory: scripts
            displayName: Export website CSVs
            env:
              DB_SERVER: $(DB_SERVER)
              DB_DATABASE: $(DB_DATABASE)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              EXTERNAL_XLSX_DATA_DIR: $(EXTERNAL_XLSX_DATA_DIR)
          - script: |
              echo Waiting 5 minutes before one retry...
              ping -n 301 127.0.0.1 >nul
              python main.py eedas update --all
              python main.py efb transform --all
              python main.py export
            workingDirectory: scripts
            displayName: Retry full pipeline once after transient failure
            condition: failed()
            env:
              DB_SERVER: $(DB_SERVER)
              DB_DATABASE: $(DB_DATABASE)
              DB_USERNAME: $(DB_USERNAME)
              DB_PASSWORD: $(DB_PASSWORD)
              EXTERNAL_XLSX_DATA_DIR: $(EXTERNAL_XLSX_DATA_DIR)
          - publish: public/data
            artifact: factbook-data
            displayName: Publish data CSV artifact

  - stage: Deploy
    displayName: Deploy to static host (placeholder)
    dependsOn: BuildWebsite
    condition: and(succeeded(), eq(variables['DeployToProduction'], 'true'))
    jobs:
      - deployment: DeployStatic
        displayName: Deploy website artifact
        environment: factbook-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: website-dist
                - script: echo "Replace with IIS/nginx/Azure Static Web Apps upload steps"
                  displayName: Placeholder deploy step
