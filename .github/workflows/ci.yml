name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Chart accessibility audit
        run: npm run audit:charts

      - name: SR content visibility audit
        run: npm run audit:sr-content

      - name: Chart spoken-summary audit
        run: npm run audit:chart-summaries

      - name: Page chrome boilerplate audit
        run: npm run audit:page-chrome

      - name: Audit (high+)
        run: npm run audit:ci

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Route accessibility smoke (axe)
        run: npm run test:a11y-routes

      - name: Lighthouse CI
        run: npm run lighthouse:ci
