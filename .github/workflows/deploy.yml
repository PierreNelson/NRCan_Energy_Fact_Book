name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Chart accessibility audit
        run: npm run audit:charts

      - name: SR content visibility audit
        run: npm run audit:sr-content

      - name: Chart spoken-summary audit
        run: npm run audit:chart-summaries

      - name: Route accessibility smoke (axe)
        run: npm run test:a11y-routes

      - name: Audit (high+)
        run: npm run audit:ci
        
      - name: Build website
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your build fails, change 'dist' to 'build' below
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
