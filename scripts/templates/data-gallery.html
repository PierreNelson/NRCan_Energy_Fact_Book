<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data glossary (SQL export)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@1.13.7/css/jquery.dataTables.min.css" />
  <style>
    :root {
      --gc-header: #26374a;
      --gc-text: #333;
      --gc-bg: #fff;
      --gc-border: #ccc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      color: var(--gc-text);
      background: var(--gc-bg);
      line-height: 1.5;
    }
    header.site-header {
      background: var(--gc-header);
      color: #fff;
      padding: 1rem 1.25rem;
    }
    header.site-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .lang-toggle button {
      background: #fff;
      color: var(--gc-header);
      border: 2px solid #fff;
      padding: 0.35rem 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
    }
    .lang-toggle button[aria-pressed="true"] {
      background: var(--gc-header);
      color: #fff;
      border-color: #fff;
    }
    .lang-toggle button:focus-visible {
      outline: 3px solid #ffbf47;
      outline-offset: 2px;
    }
    main {
      padding: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .error-banner {
      display: none;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
    .error-banner.visible { display: block; }
    section.glossary-section {
      margin-bottom: 2.5rem;
    }
    section.glossary-section h2 {
      font-size: 1.2rem;
      color: var(--gc-header);
      border-bottom: 2px solid var(--gc-header);
      padding-bottom: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .table-wrap { overflow-x: auto; }
    table.dataTable { width: 100% !important; }
    .footnote {
      font-size: 0.8rem;
      color: #555;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--gc-border);
    }
    .global-search-wrap {
      margin-bottom: 1.5rem;
      padding: 1rem 1.25rem;
      background: #f5f5f5;
      border: 1px solid var(--gc-border);
      border-radius: 4px;
    }
    .global-search-wrap label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--gc-header);
    }
    .global-search-wrap input[type="search"] {
      width: 100%;
      max-width: 560px;
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      border: 2px solid var(--gc-header);
      border-radius: 4px;
    }
    .global-search-wrap input[type="search"]:focus {
      outline: 3px solid #ffbf47;
      outline-offset: 2px;
    }
    .global-search-hint {
      font-size: 0.85rem;
      color: #555;
      margin-top: 0.5rem;
      max-width: 65ch;
    }
    section.glossary-section.hidden-no-match {
      display: none;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 id="page-heading">Data glossary (SQL export)</h1>
    <div class="toolbar">
      <span id="lang-label" style="opacity:.95;font-size:.9rem;">Language:</span>
      <div class="lang-toggle" role="group" aria-labelledby="lang-label">
        <button type="button" id="btn-en" aria-pressed="true">EN</button>
        <button type="button" id="btn-fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>
  <main>
    <div id="load-error" class="error-banner" role="alert"></div>
    <div class="global-search-wrap" id="global-search-wrap" hidden>
      <label for="global-search" id="global-search-label">Search all tables</label>
      <input type="search" id="global-search" autocomplete="off" />
      <p class="global-search-hint" id="global-search-hint"></p>
    </div>
    <div id="sections"></div>
    <p class="footnote" id="footnote"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
(function () {
  var UI = {
    en: {
      pageTitle: 'Data glossary (SQL export)',
      pageHeading: 'Data glossary (SQL export)',
      langLabel: 'Language:',
      manifestError: 'Could not load glossary_manifest.csv. Ensure this page is served from the glossary folder next to the CSV exports.',
      sectionLoadError: 'Failed to load table:',
      footnote: 'Note: content is shown from CSV exports only; it is not queried live from the database. After regenerating files, use a hard refresh (Ctrl+F5) if headings or tables look outdated.',
      searchAllLabel: 'Search all tables',
      searchAllHint: 'Filters every dataset below at once (same idea as the in-app glossary). Tables with no matches are hidden until you clear the search.',
      searchAllPlaceholder: 'e.g. oil, vector id, province…',
      lengthAll: 'All'
    },
    fr: {
      pageTitle: 'Glossaire des données (export SQL)',
      pageHeading: 'Glossaire des données (export SQL)',
      langLabel: 'Langue :',
      manifestError: 'Impossible de charger glossary_manifest.csv. Vérifiez que cette page est servie depuis le dossier glossary à côté des exportations CSV.',
      sectionLoadError: 'Échec du chargement du tableau :',
      footnote: 'Remarque : le contenu provient uniquement des exportations CSV ; il n\'est pas interrogé en direct dans la base de données. Après une nouvelle exportation, faites un rechargement forcé (Ctrl+F5) si les en-têtes semblent anciens.',
      searchAllLabel: 'Rechercher dans tous les tableaux',
      searchAllHint: 'Filtre tous les jeux de données ci-dessous en même temps (comme l’ancien glossaire). Les tableaux sans résultat sont masqués tant que la recherche n’est pas effacée.',
      searchAllPlaceholder: 'ex. pétrole, identifiant, province…',
      lengthAll: 'Tous'
    }
  };

  var uiLang = 'en';
  var manifestRows = [];
  var sectionMetas = [];
  var allTables = [];
  var globalSearchDebounce = null;

  /** Avoid stale glossary_manifest.csv / CSVs after re-export (browser HTTP cache). */
  function fetchNoCache(url) {
    return fetch(url, { cache: 'no-store' });
  }

  function t(key) {
    return UI[uiLang][key] || UI.en[key] || key;
  }

  function applyChromeStrings() {
    document.title = t('pageTitle');
    document.getElementById('page-heading').textContent = t('pageHeading');
    document.getElementById('lang-label').textContent = t('langLabel');
    document.getElementById('footnote').textContent = t('footnote');
    var glabel = document.getElementById('global-search-label');
    var ghint = document.getElementById('global-search-hint');
    var ginput = document.getElementById('global-search');
    if (glabel) glabel.textContent = t('searchAllLabel');
    if (ghint) ghint.textContent = t('searchAllHint');
    if (ginput) ginput.setAttribute('placeholder', t('searchAllPlaceholder'));
    updateLengthAllLabels();
  }

  function updateLengthAllLabels() {
    document.querySelectorAll('.dataTables_length select option').forEach(function (opt) {
      if (opt.value === '-1') opt.textContent = t('lengthAll');
    });
  }

  function tableIdFromFilename(filename) {
    return 'dt-' + filename.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  function setLang(next) {
    uiLang = next;
    document.getElementById('btn-en').setAttribute('aria-pressed', next === 'en' ? 'true' : 'false');
    document.getElementById('btn-fr').setAttribute('aria-pressed', next === 'fr' ? 'true' : 'false');
    applyChromeStrings();
    sectionMetas.forEach(function (meta) {
      var title = next === 'fr' ? meta.titleFr : meta.titleEn;
      var h2 = document.getElementById(meta.h2Id);
      if (h2) h2.textContent = title;
    });
    updateLengthAllLabels();
  }

  function showError(msg) {
    var el = document.getElementById('load-error');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function buildSection(meta, parseResult) {
    var fields = parseResult.meta.fields || [];
    var rows = parseResult.data || [];
    var columns = fields.map(function (f) {
      return { title: f, data: f, defaultContent: '' };
    });
    if (columns.length === 0) {
      columns = [{ title: '(empty)', data: null, defaultContent: '' }];
    }

    var wrap = document.createElement('section');
    wrap.className = 'glossary-section';
    var h2 = document.createElement('h2');
    h2.id = meta.h2Id;
    h2.className = 'glossary-section-title';
    h2.textContent = uiLang === 'fr' ? meta.titleFr : meta.titleEn;
    wrap.appendChild(h2);

    var tw = document.createElement('div');
    tw.className = 'table-wrap';
    var table = document.createElement('table');
    table.id = meta.tableId;
    table.className = 'display nowrap';
    table.style.width = '100%';
    tw.appendChild(table);
    wrap.appendChild(tw);
    document.getElementById('sections').appendChild(wrap);

    var defaultLen = rows.length > 100 ? 100 : 25;
    var dtOpts = {
      data: rows,
      columns: columns,
      pageLength: defaultLen,
      lengthMenu: [[25, 50, 100, -1], [25, 50, 100, t('lengthAll')]],
      deferRender: true,
      scrollX: true,
      dom: 'lrtip'
    };
    var dt = $('#' + meta.tableId).DataTable(dtOpts);
    meta.dt = dt;
    meta.sectionEl = wrap;
    allTables.push(dt);
  }

  function applyGlobalSearch() {
    var raw = document.getElementById('global-search').value;
    var q = raw.trim();
    allTables.forEach(function (dt) {
      dt.search(raw);
      dt.draw(false);
    });
    sectionMetas.forEach(function (meta) {
      if (!meta.dt || !meta.sectionEl) return;
      var n = meta.dt.rows({ search: 'applied' }).count();
      if (q && n === 0) {
        meta.sectionEl.classList.add('hidden-no-match');
      } else {
        meta.sectionEl.classList.remove('hidden-no-match');
      }
    });
  }

  function wireGlobalSearch() {
    var wrap = document.getElementById('global-search-wrap');
    var input = document.getElementById('global-search');
    if (!wrap || !input) return;
    wrap.hidden = false;
    input.addEventListener('input', function () {
      if (globalSearchDebounce) clearTimeout(globalSearchDebounce);
      globalSearchDebounce = setTimeout(applyGlobalSearch, 200);
    });
  }

  function loadManifestAndTables() {
    fetch('./glossary_manifest.csv')
      .then(function (r) {
        if (!r.ok) throw new Error(t('manifestError'));
        return r.text();
      })
      .then(function (text) {
        var parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        manifestRows = parsed.data.filter(function (row) {
          return row.filename && String(row.filename).trim();
        });
        if (manifestRows.length === 0) throw new Error(t('manifestError'));

        var chain = Promise.resolve();
        manifestRows.forEach(function (row) {
          var filename = row.filename.trim();
          var titleEn = row.title_en || filename;
          var titleFr = row.title_fr || row.title_en || filename;
          var tableId = tableIdFromFilename(filename);
          var h2Id = 'h2-' + tableId;
          var meta = { filename: filename, titleEn: titleEn, titleFr: titleFr, tableId: tableId, h2Id: h2Id };
          sectionMetas.push(meta);

          chain = chain.then(function () {
            return fetchNoCache('./' + encodeURI(filename))
              .then(function (r) {
                if (!r.ok) throw new Error(t('sectionLoadError') + ' ' + filename);
                return r.text();
              })
              .then(function (csvText) {
                var pr = Papa.parse(csvText, { header: true, skipEmptyLines: 'greedy' });
                if (pr.errors && pr.errors.length) {
                  console.warn('Parse warnings for', filename, pr.errors);
                }
                buildSection(meta, pr);
              });
          });
        });
        return chain.then(function () {
          applyChromeStrings();
          updateLengthAllLabels();
          wireGlobalSearch();
        });
      })
      .catch(function (err) {
        console.error(err);
        showError(err.message || String(err));
      });
  }

  document.getElementById('btn-en').addEventListener('click', function () { setLang('en'); });
  document.getElementById('btn-fr').addEventListener('click', function () { setLang('fr'); });

  applyChromeStrings();
  loadManifestAndTables();
})();
  </script>
</body>
</html>
