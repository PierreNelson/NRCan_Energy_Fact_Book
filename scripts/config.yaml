# ============================================================================
# NRCan Energy Factbook Data Pipeline Configuration
# ============================================================================
#
# This file controls which data sources are enabled and database connection
# settings. Environment variables can override sensitive values.
#
# Environment Variables:
#   DB_SERVER, DB_DATABASE, DB_USERNAME, DB_PASSWORD - Database connection
#
# ============================================================================

database:
  # SQL Server connection settings
  server: localhost
  database: NRCanEnergyFactbook
  # Leave username/password empty to use environment variables or Windows Auth
  username: ""
  password: ""
  # ODBC driver - leave empty for auto-detection
  driver: ""
  # Connection settings
  connection_timeout: 30
  max_retries: 3

# ============================================================================
# SECTIONS CONFIGURATION
# ============================================================================
# Each section can be enabled/disabled independently.
# Individual data sources within sections can also be toggled.

sections:
  # Section 1: Key Indicators
  section1_indicators:
    enabled: true
    name: "Key Indicators"
    sources:
      economic_contributions:
        enabled: true
        description: "Economic contributions (GDP, jobs, income) from energy sector"
        statcan_table: "36-10-0610-01"
      
      nominal_gdp:
        enabled: true
        description: "Nominal GDP by industry"
        statcan_table: "36-10-0103-01"
      
      provincial_gdp:
        enabled: true
        description: "Provincial GDP contributions"
        statcan_table: "38-10-0285-01"
      
      world_energy_production:
        enabled: true
        description: "World energy production rankings"
        source_type: "external"

      canada_energy_supply:
        enabled: true
        description: "Canada and world total energy supply by source (IEA)"
        source_type: "file"
        file_path: "oecd_iea_data.xlsx"

      us_state_energy_exports:
        enabled: true
        description: "Canadian energy exports to U.S. states"
        source_type: "file"
        file_path: "2025 Energy Exports by US State.xlsx"

      global_energy_trade:
        enabled: true
        description: "Canada's global energy trade by product"
        source_type: "file"
        file_path: "Canada_s Global Energy Trade.xlsx"

      energy_sector_employment:
        enabled: true
        description: "Employment in Canada's energy sector"
        source_type: "external"
        statcan_table: "38-10-0285-01"

      energy_and_ghg_emissions:
        enabled: true
        description: "Energy and GHG emissions, global and Canada"
        source_type: "external"
        statcan_table: "36-10-0434-01"
      
      canadian_energy_assets:
        enabled: true
        description: "Canadian Energy Assets from CEA Excel"
        source_type: "file"
        file_path: "CEA_2023.xlsx"  # relative to EXTERNAL_XLSX_DATA_DIR or repo root

      ghg_emissions:
        enabled: true
        description: "GHG emissions by Canadian economic sector (ECCC)"
        source_type: "external"
        # Indicator spec: ECCC B-Economic-Sector CSV (catalogue name GHG_Econ_Can_Prov_Terr.csv)
        source_url: "https://data-donnees.ec.gc.ca/api/file?path=%2Fsubstances%2Fmonitor%2Fcanada-s-official-greenhouse-gas-inventory%2FB-Economic-Sector%2FGHG_Econ_Can_Prov_Terr.csv"

  # Section 2: Investment
  section2_indicators:
    enabled: true
    name: "Investment"
    sources:
      capital_expenditures:
        enabled: true
        description: "Capital expenditures by industry"
        statcan_table: "34-10-0036-01"
      
      infrastructure:
        enabled: true
        description: "Infrastructure stock by category"
        statcan_table: "36-10-0608-01"
      
      investment_by_asset:
        enabled: true
        description: "Investment by asset type"
        statcan_table: "34-10-0036-01"
      
      international_investment:
        enabled: true
        description: "FDI and CDIA in energy sector"
        statcan_table: "36-10-0009-01"
      
      foreign_control:
        enabled: true
        description: "Foreign control of enterprises"
        statcan_table: "multiple"
      
      environmental_protection:
        enabled: true
        description: "Environmental protection expenditures"
        statcan_table: "38-10-0130-01"
      
      major_projects:
        enabled: true
        description: "NRCan Major Projects Inventory"
        source_type: "external"
        source_url: "https://major-projects.nrcan-rncan.gc.ca/"
      
      clean_tech:
        enabled: true
        description: "Clean technology projects"
        source_type: "derived"
      
      major_projects_map:
        enabled: true
        description: "Major projects map data from NRCan ArcGIS"
        source_type: "api"
        source_url: "https://maps-cartes.services.geo.ca/server_serveur/rest/services/NRCan/major_projects_inventory_en/MapServer"

  # Section 3: Skills, diversity and community
  section3_indicators:
    enabled: true
    name: "Skills, diversity and community"
    sources:
      demographic_representation:
        enabled: true
        description: "Representation of demographic groups in the energy sector and all industries"
        source_type: "file"
        file_path: "t4_NRSA_final.xlsx"
        statcan_table: "98-10-0585-01"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810058501"
      household_energy_expenditures:
        enabled: true
        description: "Household energy expenditures and consumer price index"
        source_type: "external"
        statcan_table: "18-10-0004-01"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1810000401"
      household_energy_prices:
        enabled: true
        description: "Household energy prices per unit for Canada and peer countries"
        source_type: "file"
        file_path: "oecd_iea_data.xlsx"
        source_url: "https://www.iea.org/data-and-statistics"
      energy_sector_demographics:
        enabled: true
        description: "Energy sector demographics and wages from NRSA workbooks, census immigrant status, and SNA compensation"
        source_type: "file"
        file_path: "t4_NRSA_final.xlsx"
        statcan_table: "98-10-0585-01"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=9810058501"
      energy_poverty_geography:
        enabled: true
        description: "Energy poverty rates by geography"
        source_type: "external"
        statcan_table: "11-10-0222-01"
        source_url: "https://www150.statcan.gc.ca/n1/pub/46-28-0001/2024001/article/00001-eng.htm"
      energy_reliant_communities:
        enabled: true
        description: "Energy reliant communities by province and rural or urban"
        source_type: "file"
        file_path: "EnergyRelianceResults_Updated.xlsx"

  # Section 3 placeholder kept so older config keys still resolve
  section3_skills:
    enabled: false
    name: "Skills, Diversity and Community"
    sources: {}

  # Section 4: Energy Efficiency
  section4_indicators:
    enabled: true
    name: "Energy Efficiency"
    sources:
      energy_use:
        enabled: true
        description: "Energy use by sector (OEE NEUD + Primary and secondary demand), PJ"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "Primary and secondary demand"
        # Optional overrides (relative to EXTERNAL_XLSX_DATA_DIR):
        oee_neud_file_path: ""
        primary_demand_file_path: ""
      seu_by_fuel:
        enabled: true
        description: "Secondary energy use (final demand) by fuel type"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "SEU (final demand)"
        seu_final_demand_file_path: ""
      residential_daily_lives:
        enabled: true
        description: "Residential energy (energy in our daily lives) - EE Improvement + optional Residential sheet"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
        ee_improvement_file_path: ""
      residential_pie_charts:
        enabled: true
        description: "Residential by type and space/water heating by source from OEE HB, Table 7, Table 14"
      commercial_institutional:
        enabled: true
        description: "Commercial and institutional energy use by end use from OEE HB, AN, and EE Improvement"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
      industrial_sector:
        enabled: true
        description: "Industrial sector energy use by fuel type from OEE CP and EE Improvement"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
        ee_improvement_file_path: ""

  # Section 5: Clean Power and Low Carbon Fuels
  section5_indicators:
    enabled: true
    name: "Clean Power and Low Carbon Fuels"
    sources:
      environmental_clean_tech:
        enabled: true
        description: "Environmental and clean technology (GDP, jobs, exports) + TSX/TSXV cleantech list"
        statcan_table: "14-10-0023-01, 36-10-0103-01, 36-10-0645-01, 36-10-0632-01, 36-10-0629-01"
        source_type: "external"
        source_url: "https://www.tsx.com/resource/en/571"
        # Optional: path to TSX cleantech XLSX (relative to scripts/ or absolute). If unset, scripts/tmx_cleantech.xlsx is used when present.
        # tmx_xlsx_path: "tmx_cleantech.xlsx"
      cleantech_companies_geo:
        enabled: true
        description: "Cleantech companies by province and region"
        source_type: "web"
        source_url: "https://natural-resources.canada.ca/science-innovation/research-development/clean-technology/clean-growth-hub/clean-technology-data-strategy/cleantech-companies"
      cleantech_companies_industry:
        enabled: true
        description: "Cleantech companies by industry"
        source_type: "web"
        source_url: "https://natural-resources.canada.ca/science-innovation/research-development/clean-technology/clean-growth-hub/clean-technology-data-strategy/cleantech-companies"
      ev_sales:
        enabled: true
        description: "Plug-in electric vehicle registrations"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2010002501"
      electricity_generation_by_source:
        enabled: true
        description: "Canadian and provincial electricity generation by source (gencap src_elegen_can / src_elegen_prov)"
        source_type: "external"
        source_url: ""
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "src_elegen_can, src_elegen_prov"
      electricity_trade_us:
        enabled: true
        description: "Electricity trade with the U.S. ( CER XLSM)"
        source_type: "web"
        source_url: "https://www.cer-rec.gc.ca/en/data-analysis/energy-commodities/electricity/statistics/electricity-trade-summary/electricity-trades-summary-resume-echanges-commerciaux-electricite.xlsm"
      wind_capacity_by_province:
        enabled: true
        description: "Wind capacity by province ( gencap workbook)"
        source_type: "external"
        source_url: ""
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "src_elecap_prov"
      wind_power_canada:
        enabled: true
        description: "Wind power capacity and generation in Canada ( cap/gen workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Wind capacity and generation_Canada.xlsx"
        sheet_name: "cap, gen"
      world_wind_power:
        enabled: true
        description: "World wind power capacity ranking and Canada wind generation share"
        source_type: "external"
        source_url: ""
        file_path: "World capacity of wind and solar power.xlsx"
        sheet_name: "worldcap_wind"
      world_solar_pv:
        enabled: true
        description: "World solar PV capacity ranking"
        source_type: "external"
        source_url: ""
        file_path: "World capacity of wind and solar power.xlsx"
        sheet_name: "worldcap_solar"
      renewable_electricity_capacity:
        enabled: true
        description: "Canadian renewable electricity generating capacity ( gencap ren_elecap sheet)"
        source_type: "external"
        source_url: ""
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "ren_elecap"
      ghg_electricity_spotlight:
        enabled: true
        description: "GHG spotlight electricity ( ECCC environmental indicators + gencap coal_elegen)"
        source_type: "web"
        source_url: "https://www.canada.ca/en/environment-climate-change/services/environmental-indicators/greenhouse-gas-emissions.html"
        csv_url: "https://www.canada.ca/content/dam/eccc/documents/csv/cesindicators/ghg-emissions/2026/ghg-emissions-electricity-en.csv"
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "coal_elegen"
      largest_wind_projects:
        enabled: true
        description: "Largest wind projects 200 MW+ ( Manual Data workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Largest hydrofac, wind and solar projects.xlsx"
        sheet_name: "windprojects"
      largest_solar_projects:
        enabled: true
        description: "Largest solar projects 50 MW+ ( Manual Data workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Largest hydrofac, wind and solar projects.xlsx"
        sheet_name: "solprojects"
      major_hydro_facilities:
        enabled: true
        description: "Major hydro facilities in Canada 1,000 MW+ ( Manual Data workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Largest hydrofac, wind and solar projects.xlsx"
        sheet_name: "hydrofac"
      canadian_renewable_energy_production:
        enabled: true
        description: "Canadian renewable energy production by source"
        source_type: "external"
        source_url: "https://www.iea.org/data-and-statistics"
        file_path: "oecd_iea_data.xlsx"
        sheet_name: "renewables_canada_production"
      biomass:
        enabled: true
        description: "Biomass share of OECD and Canadian renewable energy production"
        source_type: "external"
        source_url: "https://www.iea.org/data-and-statistics"
        file_path: "oecd_iea_data.xlsx"
        narrative_file: "biomass_narrative.xlsx"
      electric_vehicle_charging:
        enabled: true
        description: "Electric vehicle charging levels"
        source_type: "external"
        source_url: "https://natural-resources.canada.ca/energy-sources/energy-facts"
        file_path: "ev_charging_narrative.xlsx"
        sheet_name: "ev_charging_narrative"
      global_hydrogen_production_demand:
        enabled: true
        description: "Global hydrogen production and demand"
        source_type: "external"
        source_url: "https://www.iea.org/search?q=global%20hydrogen"
        file_path: "iea_h2_narrative_summary_global_prod_and_demand.xlsx"
      hydroelectricity:
        enabled: true
        description: "Hydroelectricity share of Canada generation and world generation ranking"
        source_type: "external"
        source_url: "https://www.iea.org/data-and-statistics"
        file_path: "oecd_iea_data.xlsx"
        canada_file: "secondary Master gencap file.xlsx"
      hydrogen_narrative:
        enabled: true
        description: "Hydrogen introduction and Canada hydrogen industry summary"
        source_type: "external"
        source_url: "https://www.iea.org/search?q=global%20hydrogen"
        file_path: "iea_h2_narrative_summary_global_prod_and_demand.xlsx"
      electricity_world_production:
        enabled: true
        description: "World electricity production and export rankings"
        source_type: "external"
        source_url: "https://www.iea.org/data-and-statistics"
        file_path: "oecd_iea_data.xlsx"
      world_biofuels_production:
        enabled: true
        description: "World liquid biofuels production ranking and regional trend"
        source_type: "external"
        source_url: "https://www.iea.org/data-and-statistics"
        file_path: "oecd_iea_data.xlsx"
      solid_biofuels:
        enabled: true
        description: "Canadian production of solid biofuels ( RenAQ + StatCan 25-10-0031-01)"
        source_type: "external"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510003101"
        file_path: "RenAQ.xlsx"
        statcan_table: "25100031"
      electrical_energy_use:
        enabled: true
        description: "Electrical energy use by sector and province ( OEE NEUD)"
        source_type: "external"
        source_url: "https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/data_e.html"
      electricity_prices:
        enabled: true
        description: "Average large industrial and residential electricity prices ( HydroQ)"
        source_type: "external"
        source_url: "https://www.nrcan.gc.ca/science-data/data-analysis/energy-data-analysis/energy-facts/electricity-prices/20578"
        file_path: "Average prices (ELE-Res&Ind).xlsx"
      wind_solar_electricity_growth:
        enabled: true
        description: "Wind and solar net electricity generation growth in Canada"
        source_type: "external"
        source_url: "https://www.nrcan.gc.ca/science-data/data-analysis/energy-data-analysis/energy-facts/electricity-generation/20579"
        file_path: "2011 Electricity generation.xlsx"
      uranium_international:
        enabled: true
        description: "Uranium international context — world exports, production, recoverable resources"
        source_type: "web"
        source_url: "https://world-nuclear.org/information-library/nuclear-fuel-cycle/mining-of-uranium/world-uranium-mining-production.aspx"
        file_path: "oecd-nea_theredbook.xlsx"

  # Section 6: Oil, Natural Gas and Coal
  section6_indicators:
    enabled: true
    name: "Oil, Natural Gas and Coal"
    sources:
      rpp_supply_demand:
        enabled: true
        description: "RPP supply and disposition (StatCan 25-10-0081-01)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510008101"
      rpp_refinery_input:
        enabled: true
        description: "Input to Canadian refineries (StatCan 25-10-0063-01)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510006301"
      crude_prices:
        enabled: true
        description: "WTI and WCS crude oil prices and differential"
        source_type: "external"
        source_url: "https://www.eia.gov/dnav/pet/xls/PET_PRI_SPT_S1_M.xls"
      oil_sands:
        enabled: true
        description: "Oil sands capex and production share"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3410003601"
      canadian_production:
        enabled: true
        description: "Canadian crude production by type and province"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510006301"
      kal_gas_prices:
        enabled: true
        description: "Gasoline retail price components (Kalibrate charting tool)"
        source_type: "web"
        source_url: "https://charting.kalibrate.com/Charting/Margins"
        section6_xlsx: "Section 6.xlsx"
      osm_refin_cap:
        enabled: true
        description: "Canadian refinery capacity by province (Oil Sands Magazine)"
        source_type: "web"
        source_url: "https://www.oilsandsmagazine.com/projects/canadian-refineries"
      petroleum_reserves:
        enabled: true
        description: "Canadian proved reserves of crude oil"
        source_type: "file"
        file_path: "energy_rankings_and_petroleum_emp.xlsx"
        sheet: "petroleum_reserves_summary"
      western_canada_oil_wells:
        enabled: true
        description: "Count and average depth of oil wells completed in Western Canada"
        source_type: "external"
        source_url: "https://www.aer.ca/data-and-performance-reports/statistical-reports/st59"
        mb_file_path: "energy_rankings_and_petroleum_emp.xlsx"
        mb_sheet: "mb_oil_wells_count_depth"
      petroleum_sector_employment:
        enabled: true
        description: "Petroleum sector direct and indirect employment by region"
        source_type: "file"
        file_path: "energy_rankings_and_petroleum_emp.xlsx"
        sheet: "petroleum_sector_employment"
      world_proved_crude_reserves:
        enabled: true
        description: "World proved reserves of crude oil"
        source_type: "file"
        file_path: "energy_rankings_and_petroleum_emp.xlsx"
        sheet: "proved_reserves_crude_oil"

# ============================================================================
# EXPORT CONFIGURATION
# ============================================================================

export:
  output_dir: "../public/data"
  backup_enabled: true
  backup_dir: "../public/data/.backups"
  keep_backups: 5
  files:
    data_csv: "data.csv"
    metadata_csv: "metadata.csv"
    major_projects_csv: "major_projects_map.csv"

# ============================================================================
# RESILIENCE CONFIGURATION
# ============================================================================

resilience:
  fetch_max_retries: 3
  fetch_retry_delay_seconds: 2

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    directory: "logs"  # relative to scripts/
