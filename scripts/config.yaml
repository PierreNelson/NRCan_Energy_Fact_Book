# ============================================================================
# NRCan Energy Factbook Data Pipeline Configuration
# ============================================================================
#
# This file controls which data sources are enabled and database connection
# settings. Environment variables can override sensitive values.
#
# Environment Variables:
#   DB_SERVER, DB_DATABASE, DB_USERNAME, DB_PASSWORD - Database connection
#
# ============================================================================

database:
  # SQL Server connection settings
  server: localhost
  database: NRCanEnergyFactbook
  # Leave username/password empty to use environment variables or Windows Auth
  username: ""
  password: ""
  # ODBC driver - leave empty for auto-detection
  driver: ""
  # Connection settings
  connection_timeout: 30
  max_retries: 3

# ============================================================================
# SECTIONS CONFIGURATION
# ============================================================================
# Each section can be enabled/disabled independently.
# Individual data sources within sections can also be toggled.

sections:
  # Section 1: Key Indicators
  section1_indicators:
    enabled: true
    name: "Key Indicators"
    sources:
      economic_contributions:
        enabled: true
        description: "Economic contributions (GDP, jobs, income) from energy sector"
        statcan_table: "36-10-0610-01"
      
      nominal_gdp:
        enabled: true
        description: "Nominal GDP by industry"
        statcan_table: "36-10-0103-01"
      
      provincial_gdp:
        enabled: true
        description: "Provincial GDP contributions"
        statcan_table: "38-10-0285-01"
      
      world_energy_production:
        enabled: true
        description: "World energy production rankings"
        source_type: "external"
      
      canadian_energy_assets:
        enabled: true
        description: "Canadian Energy Assets from CEA Excel"
        source_type: "file"
        file_path: "CEA_2023.xlsx"  # relative to EXTERNAL_XLSX_DATA_DIR or repo root

      ghg_emissions:
        enabled: true
        description: "GHG emissions by Canadian economic sector (ECCC)"
        source_type: "external"
        # Page 20 spec: ECCC B-Economic-Sector CSV (catalogue name GHG_Econ_Can_Prov_Terr.csv)
        source_url: "https://data-donnees.ec.gc.ca/api/file?path=%2Fsubstances%2Fmonitor%2Fcanada-s-official-greenhouse-gas-inventory%2FB-Economic-Sector%2FGHG_Econ_Can_Prov_Terr.csv"

  # Section 2: Investment
  section2_indicators:
    enabled: true
    name: "Investment"
    sources:
      capital_expenditures:
        enabled: true
        description: "Capital expenditures by industry"
        statcan_table: "34-10-0036-01"
      
      infrastructure:
        enabled: true
        description: "Infrastructure stock by category"
        statcan_table: "36-10-0608-01"
      
      investment_by_asset:
        enabled: true
        description: "Investment by asset type"
        statcan_table: "34-10-0036-01"
      
      international_investment:
        enabled: true
        description: "FDI and CDIA in energy sector"
        statcan_table: "36-10-0009-01"
      
      foreign_control:
        enabled: true
        description: "Foreign control of enterprises"
        statcan_table: "multiple"
      
      environmental_protection:
        enabled: true
        description: "Environmental protection expenditures"
        statcan_table: "38-10-0130-01"
      
      major_projects:
        enabled: true
        description: "NRCan Major Projects Inventory"
        source_type: "external"
        source_url: "https://major-projects.nrcan-rncan.gc.ca/"
      
      clean_tech:
        enabled: true
        description: "Clean technology projects"
        source_type: "derived"
      
      major_projects_map:
        enabled: true
        description: "Major projects map data from NRCan ArcGIS"
        source_type: "api"
        source_url: "https://maps-cartes.services.geo.ca/server_serveur/rest/services/NRCan/major_projects_inventory_en/MapServer"

  # Section 3: Skills, Diversity and Community (placeholder)
  section3_skills:
    enabled: false
    name: "Skills, Diversity and Community"
    sources: {}

  # Section 4: Energy Efficiency
  section4_indicators:
    enabled: true
    name: "Energy Efficiency"
    sources:
      energy_use:
        enabled: true
        description: "Energy use by sector (OEE NEUD + Primary and secondary demand), PJ"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "Primary and secondary demand"
        # Optional overrides (relative to EXTERNAL_XLSX_DATA_DIR):
        oee_neud_file_path: ""
        primary_demand_file_path: ""
      seu_by_fuel:
        enabled: true
        description: "Secondary energy use (final demand) by fuel type"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "SEU (final demand)"
        seu_final_demand_file_path: ""
      residential_daily_lives:
        enabled: true
        description: "Residential energy (energy in our daily lives) - EE Improvement + optional Residential sheet"
        source_type: "file"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
        ee_improvement_file_path: ""
      residential_pie_charts:
        enabled: true
        description: "Residential by type and space/water heating by source from OEE HB, Table 7, Table 14"
      commercial_institutional:
        enabled: true
        description: "Commercial and institutional energy use by end use from OEE HB, AN, and EE Improvement"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
      industrial_sector:
        enabled: true
        description: "Industrial sector energy use by fuel type from OEE CP and EE Improvement"
        file_path: "Energy Efficiency.xlsx"
        sheet_name: "EE Improvement"
        ee_improvement_file_path: ""

  # Section 5: Clean Power and Low Carbon Fuels
  section5_indicators:
    enabled: true
    name: "Clean Power and Low Carbon Fuels"
    sources:
      environmental_clean_tech:
        enabled: true
        description: "Environmental and clean technology (GDP, jobs, exports) + TSX/TSXV cleantech list"
        statcan_table: "14-10-0023-01, 36-10-0103-01, 36-10-0645-01, 36-10-0632-01, 36-10-0629-01"
        source_type: "external"
        source_url: "https://www.tsx.com/resource/en/571"
        # Optional: path to TSX cleantech XLSX (relative to scripts/ or absolute). If unset, scripts/tmx_cleantech.xlsx is used when present.
        # tmx_xlsx_path: "tmx_cleantech.xlsx"
      cleantech_companies_geo:
        enabled: true
        description: "Cleantech companies by province and region"
        source_type: "web"
        source_url: "https://natural-resources.canada.ca/science-innovation/research-development/clean-technology/clean-growth-hub/clean-technology-data-strategy/cleantech-companies"
      cleantech_companies_industry:
        enabled: true
        description: "Cleantech companies by industry"
        source_type: "web"
        source_url: "https://natural-resources.canada.ca/science-innovation/research-development/clean-technology/clean-growth-hub/clean-technology-data-strategy/cleantech-companies"
      ev_sales:
        enabled: true
        description: "Plug-in electric vehicle registrations (Page 96)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2010002501"
      electricity_trade_us:
        enabled: true
        description: "Electricity trade with the U.S. (Page 65, CER XLSM)"
        source_type: "web"
        source_url: "https://www.cer-rec.gc.ca/en/data-analysis/energy-commodities/electricity/statistics/electricity-trade-summary/electricity-trades-summary-resume-echanges-commerciaux-electricite.xlsm"
      wind_capacity_by_province:
        enabled: true
        description: "Wind capacity by province (Page 81, gencap workbook)"
        source_type: "external"
        source_url: ""
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "src_elecap_prov"
      renewable_electricity_capacity:
        enabled: true
        description: "Canadian renewable electricity generating capacity (Page 74, gencap ren_elecap sheet)"
        source_type: "external"
        source_url: ""
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "ren_elecap"
      ghg_electricity_spotlight:
        enabled: true
        description: "GHG spotlight electricity (Page 71, ECCC environmental indicators + gencap coal_elegen)"
        source_type: "web"
        source_url: "https://www.canada.ca/en/environment-climate-change/services/environmental-indicators/greenhouse-gas-emissions.html"
        csv_url: "https://www.canada.ca/content/dam/eccc/documents/csv/cesindicators/ghg-emissions/2026/ghg-emissions-electricity-en.csv"
        file_path: "secondary Master gencap file.xlsx"
        sheet_name: "coal_elegen"
      largest_wind_projects:
        enabled: true
        description: "Largest wind projects 200 MW+ (Page 81, Manual Data workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Largest hydrofac, wind and solar projects.xlsx"
        sheet_name: "windprojects"
      largest_solar_projects:
        enabled: true
        description: "Largest solar projects 50 MW+ (Page 84, Manual Data workbook)"
        source_type: "external"
        source_url: ""
        file_path: "Largest hydrofac, wind and solar projects.xlsx"
        sheet_name: "solprojects"
      solid_biofuels:
        enabled: true
        description: "Canadian production of solid biofuels (Page 78, RenAQ + StatCan 25-10-0031-01)"
        source_type: "external"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510003101"
        file_path: "RenAQ.xlsx"
        statcan_table: "25100031"

  # Section 6: Oil, Natural Gas and Coal
  section6_indicators:
    enabled: true
    name: "Oil, Natural Gas and Coal"
    sources:
      rpp_supply_demand:
        enabled: true
        description: "RPP supply and disposition (StatCan 25-10-0081-01)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510008101"
      rpp_refinery_input:
        enabled: true
        description: "Input to Canadian refineries (StatCan 25-10-0063-01)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510006301"
      crude_prices:
        enabled: true
        description: "WTI and WCS crude oil prices and differential"
        source_type: "external"
        source_url: "https://www.eia.gov/dnav/pet/xls/PET_PRI_SPT_S1_M.xls"
      oil_sands:
        enabled: true
        description: "Oil sands capex and production share"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3410003601"
      canadian_production:
        enabled: true
        description: "Canadian crude production by type and province (Page 111)"
        source_type: "statcan"
        source_url: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2510006301"
      kal_gas_prices:
        enabled: true
        description: "Gasoline retail price components (Kalibrate charting tool, Page 138)"
        source_type: "web"
        source_url: "https://charting.kalibrate.com/Charting/Margins"
        section6_xlsx: "Section 6.xlsx"
      osm_refin_cap:
        enabled: true
        description: "Canadian refinery capacity by province (Oil Sands Magazine, Page 139)"
        source_type: "web"
        source_url: "https://www.oilsandsmagazine.com/projects/canadian-refineries"

# ============================================================================
# EXPORT CONFIGURATION
# ============================================================================

export:
  output_dir: "../public/data"
  backup_enabled: true
  backup_dir: "../public/data/.backups"
  keep_backups: 5
  files:
    data_csv: "data.csv"
    metadata_csv: "metadata.csv"
    major_projects_csv: "major_projects_map.csv"

# ============================================================================
# RESILIENCE CONFIGURATION
# ============================================================================

resilience:
  fetch_max_retries: 3
  fetch_retry_delay_seconds: 2

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    directory: "logs"  # relative to scripts/
