<text x="62" y="214" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="66" font-weight="700" fill="#2b6489" text-anchor="start">56 %</text>
<text x="15" y="249" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Les émissions de GES</text>
<text x="15" y="265" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ont diminué de</text>
