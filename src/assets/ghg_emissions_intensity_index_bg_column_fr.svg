<text x="88" y="319" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="43" font-weight="700" fill="#2b6489" text-anchor="start">39 %</text>
<text x="73" y="329" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">par dollar de PIB et de</text>
