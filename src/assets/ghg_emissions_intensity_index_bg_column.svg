<svg xmlns="http://www.w3.org/2000/svg" width="276" height="532" viewBox="0 0 276 532">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="19" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="start">Between 2000 and 2023,</text>
<text x="20" y="41" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="start">Canada’s GHG emissions</text>
<text x="20" y="63" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="start">decreased by</text>
<polygon points="32.4,78.0 71.6,78.0 71.6,127.3 87.0,127.3 52.0,163.0 17.0,127.3 32.4,127.3" fill="#a6cf3d"/>
<text x="91" y="157" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="88" font-weight="700" fill="#2b6489" text-anchor="start">7%</text>
<text x="20" y="199" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="start">while GDP increased</text>
<polygon points="54.0,210.0 91.0,245.3 74.7,245.3 74.7,294.0 33.3,294.0 33.3,245.3 17.0,245.3" fill="#a6cf3d"/>
<text x="99" y="292" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="88" font-weight="700" fill="#2b6489" text-anchor="start">56%</text>
<text x="20" y="340" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="start">GHG emissions decreased</text>
<polygon points="33.4,349.0 72.6,349.0 72.6,409.3 88.0,409.3 53.0,453.0 18.0,409.3 33.4,409.3" fill="#a6cf3d"/>
<text x="96" y="404" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="68" font-weight="700" fill="#2b6489" text-anchor="start">39%</text>
<text x="97" y="433" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="start">per dollar of GDP and</text>
<text x="89" y="496" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="66" font-weight="700" fill="#2b6489" text-anchor="start">26.1%</text>
<text x="160" y="520" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="start">per capita.</text>
