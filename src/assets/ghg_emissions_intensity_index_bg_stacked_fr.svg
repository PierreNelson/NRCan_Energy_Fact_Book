<rect width="100%" height="100%" fill="#ffffff"/>
<text x="8" y="18" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="14" font-weight="700" fill="#111111" text-anchor="start">Entre 2000 et 2023,</text>
<text x="8" y="35" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="14" font-weight="700" fill="#111111" text-anchor="start">les émissions de GES</text>
