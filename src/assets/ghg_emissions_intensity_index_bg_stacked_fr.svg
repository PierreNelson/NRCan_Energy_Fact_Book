<polygon points="24.0,67.0 62.0,67.0 62.0,101.8 77.0,101.8 43.0,127.0 9.0,101.8 24.0,101.8" fill="#a6cf3d"/>
<text x="66" y="118" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="67" font-weight="700" fill="#2b6489" text-anchor="start">7 %</text>
<text x="342" y="15" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="start">tandis que le PIB a augmenté de</text>
<polygon points="371.0,29.0 405.0,53.4 390.0,53.4 390.0,87.0 352.0,87.0 352.0,53.4 337.0,53.4" fill="#a6cf3d"/>
<text x="397" y="81" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="66" font-weight="700" fill="#2b6489" text-anchor="start">56 %</text>
<text x="728" y="17" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Les émissions de GES</text>
<text x="728" y="33" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ont diminué de</text>
