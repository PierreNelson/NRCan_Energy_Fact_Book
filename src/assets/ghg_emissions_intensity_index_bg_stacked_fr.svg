<text x="800" y="88" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="43" font-weight="700" fill="#2b6489" text-anchor="start">39 %</text>
<text x="785" y="105" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">par dollar de PIB et de</text>
<text x="792" y="154" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="47" font-weight="700" fill="#2b6489" text-anchor="start">26,1 %</text>
<text x="818" y="170" font-family="'Arial Narrow', 'Roboto Condensed', 'Helvetica Condensed', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" text-anchor="start">par habitant</text>
